<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1b4b; display: flex; flex-direction: column; align-items: center; gap: 60px; padding: 60px; font-family: 'Inter', sans-serif; }

    h2 { color: #94a3b8; font-size: 14px; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; margin-bottom: -40px; }

    /* ── SQUARE LOGO 1080×1080 ── */
    .logo-square {
      width: 1080px;
      height: 1080px;
      background: #0f172a;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .icon-box {
      width: 320px;
      height: 320px;
      border-radius: 72px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rocket-svg { width: 170px; height: 170px; }

    .brand-name {
      font-size: 96px;
      font-weight: 900;
      color: white;
      letter-spacing: -3px;
    }

    .brand-name span { color: #818cf8; }

    .tagline-sq {
      font-size: 32px;
      font-weight: 400;
      color: #64748b;
      letter-spacing: 1px;
    }

    /* ── BANNER 1200×630 ── */
    .logo-banner {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 52px;
      position: relative;
      overflow: hidden;
    }

    .logo-banner::before {
      content: '';
      position: absolute;
      left: -80px;
      top: 50%;
      transform: translateY(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }

    .banner-icon {
      width: 180px;
      height: 180px;
      border-radius: 40px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .banner-icon .rocket-svg { width: 100px; height: 100px; }

    .banner-text { display: flex; flex-direction: column; gap: 10px; }

    .banner-brand {
      font-size: 100px;
      font-weight: 900;
      color: white;
      letter-spacing: -4px;
      line-height: 1;
    }

    .banner-brand span { color: #818cf8; }

    .banner-tagline {
      font-size: 26px;
      font-weight: 400;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    /* ── ICON ONLY 400×400 ── */
    .logo-icon-only {
      width: 400px;
      height: 400px;
      border-radius: 80px;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon-only .rocket-svg { width: 220px; height: 220px; }
  </style>
</head>
<body>

  <h2>Square Logo — 1080 × 1080 (Facebook profile photo)</h2>

  <div class="logo-square">
    <div class="icon-box">
      <svg class="rocket-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Rocket body -->
        <path d="M50 8 C65 12 76 28 76 50 C76 66 65 78 50 86 C35 78 24 66 24 50 C24 28 35 12 50 8Z" fill="white" opacity="0.95"/>
        <!-- Window -->
        <circle cx="50" cy="44" r="11" fill="#7c3aed" opacity="0.8"/>
        <circle cx="50" cy="44" r="7" fill="white" opacity="0.9"/>
        <!-- Left fin -->
        <path d="M24 62 L10 82 L28 74Z" fill="white" opacity="0.85"/>
        <!-- Right fin -->
        <path d="M76 62 L90 82 L72 74Z" fill="white" opacity="0.85"/>
        <!-- Flame outer -->
        <ellipse cx="50" cy="98" rx="14" ry="18" fill="#f59e0b" opacity="0.75"/>
        <!-- Flame inner -->
        <ellipse cx="50" cy="95" rx="8" ry="12" fill="#fef3c7" opacity="0.95"/>
      </svg>
    </div>
    <div class="brand-name">Resume<span>Rocket</span></div>
    <div class="tagline-sq">AI Resumes That Land Interviews</div>
  </div>

  <h2>Banner — 1200 × 630 (Facebook cover / OG image)</h2>

  <div class="logo-banner">
    <div class="banner-icon">
      <svg class="rocket-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8 C65 12 76 28 76 50 C76 66 65 78 50 86 C35 78 24 66 24 50 C24 28 35 12 50 8Z" fill="white" opacity="0.95"/>
        <circle cx="50" cy="44" r="11" fill="#7c3aed" opacity="0.8"/>
        <circle cx="50" cy="44" r="7" fill="white" opacity="0.9"/>
        <path d="M24 62 L10 82 L28 74Z" fill="white" opacity="0.85"/>
        <path d="M76 62 L90 82 L72 74Z" fill="white" opacity="0.85"/>
        <ellipse cx="50" cy="98" rx="14" ry="18" fill="#f59e0b" opacity="0.75"/>
        <ellipse cx="50" cy="95" rx="8" ry="12" fill="#fef3c7" opacity="0.95"/>
      </svg>
    </div>
    <div class="banner-text">
      <div class="banner-brand">Resume<span>Rocket</span></div>
      <div class="banner-tagline">AI-Powered Resumes That Land Interviews</div>
    </div>
  </div>

  <h2>Icon Only — 400 × 400 (profile photo crop)</h2>

  <div class="logo-icon-only">
    <svg class="rocket-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 8 C65 12 76 28 76 50 C76 66 65 78 50 86 C35 78 24 66 24 50 C24 28 35 12 50 8Z" fill="white" opacity="0.95"/>
      <circle cx="50" cy="44" r="11" fill="#7c3aed" opacity="0.8"/>
      <circle cx="50" cy="44" r="7" fill="white" opacity="0.9"/>
      <path d="M24 62 L10 82 L28 74Z" fill="white" opacity="0.85"/>
      <path d="M76 62 L90 82 L72 74Z" fill="white" opacity="0.85"/>
      <ellipse cx="50" cy="98" rx="14" ry="18" fill="#f59e0b" opacity="0.75"/>
      <ellipse cx="50" cy="95" rx="8" ry="12" fill="#fef3c7" opacity="0.95"/>
    </svg>
  </div>

</body>
</html>
