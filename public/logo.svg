<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0f172a"/>

  <!-- Gradient card -->
  <rect x="240" y="240" width="600" height="600" rx="120" ry="120" fill="url(#bg)"/>

  <!-- Rocket body -->
  <g transform="translate(540, 500)">
    <!-- Main rocket body -->
    <path d="M0,-180 C60,-160 100,-100 100,0 C100,80 60,130 0,160 C-60,130 -100,80 -100,0 C-100,-100 -60,-160 0,-180 Z"
          fill="url(#iconGrad)" opacity="0.95"/>

    <!-- Rocket nose tip (circle at top) -->
    <circle cx="0" cy="-180" r="22" fill="white"/>

    <!-- Rocket window -->
    <circle cx="0" cy="-40" r="34" fill="#7c3aed" opacity="0.8"/>
    <circle cx="0" cy="-40" r="22" fill="white" opacity="0.9"/>

    <!-- Left fin -->
    <path d="M-100,60 L-160,160 L-70,120 Z" fill="white" opacity="0.85"/>

    <!-- Right fin -->
    <path d="M100,60 L160,160 L70,120 Z" fill="white" opacity="0.85"/>

    <!-- Exhaust flame outer -->
    <ellipse cx="0" cy="220" rx="50" ry="70" fill="#f59e0b" opacity="0.7"/>
    <!-- Exhaust flame inner -->
    <ellipse cx="0" cy="205" rx="30" ry="45" fill="#fef3c7" opacity="0.9"/>
  </g>
</svg>
